name: CI

# Runs on every push and pull request to any branch
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Install MAUI workload (required to build the MAUI project)
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      # 4. Restore NuGet dependencies per project
      #    The MAUI project requires -r win-x64 to download the correct runtime pack
      #    The Core and Tests projects use net10.0 and don't need a RID
      - name: Restore dependencies
        run: |
          dotnet restore RetroTetris.Core/RetroTetris.Core.csproj
          dotnet restore RetroTetris/RetroTetris.csproj -r win-x64
          dotnet restore RetroTetris.Tests/RetroTetris.Tests.csproj

      # 5. Build each project to verify nothing is broken
      - name: Build
        run: |
          dotnet build RetroTetris.Core/RetroTetris.Core.csproj --no-restore -c Release
          dotnet build RetroTetris/RetroTetris.csproj --no-restore -c Release -r win-x64
          dotnet build RetroTetris.Tests/RetroTetris.Tests.csproj --no-restore -c Release

      # 6. Run the test project
      - name: Test
        run: dotnet test RetroTetris.Tests/RetroTetris.Tests.csproj --no-build -c Release
