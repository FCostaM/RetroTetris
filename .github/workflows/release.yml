name: Release

# Triggered when a tag like v1.0.0 is pushed
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Install MAUI workload (required to build .NET MAUI projects)
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      # 4. Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore RetroTetris/RetroTetris.csproj

      # 5. Publish a self-contained Windows executable
      #    --self-contained true: bundles the .NET runtime — no installation required on target machine
      #    -r win-x64: targets 64-bit Windows
      #    -c Release: uses Release configuration (optimized build)
      - name: Publish
        run: >
          dotnet publish RetroTetris/RetroTetris.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -r win-x64
          --self-contained true
          -o publish/RetroTetris

      # 6. Zip the published output
      #    The tag name (e.g. v1.0.0) is used to name the zip file
      - name: Zip artifact
        run: Compress-Archive -Path publish/RetroTetris/* -DestinationPath RetroTetris-${{ github.ref_name }}-win-x64.zip

      # 7. Create a GitHub Release and attach the zip
      #    generate_release_notes: auto-generates changelog from commits since last tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RetroTetris ${{ github.ref_name }}
          generate_release_notes: true
          files: RetroTetris-${{ github.ref_name }}-win-x64.zip
